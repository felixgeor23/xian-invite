<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李锦记西安推介会 · 邀请函</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237A0E12'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23E9C783' stroke-width='2'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23F7E2B0' font-family='serif' font-weight='bold'%3E%E5%AE%B4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#4A0A0E;
    --wine-mid:#6B1318;
    --gold:#D9B46A;
    --gold-bright:#F0D489;
    --ivory:#F8EEDD;
    --cream:#FBF4E6;
    --ink:#3A080B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Noto Sans SC','PingFang SC',sans-serif;
    background:#1F0305;
    color:var(--ink);
    display:flex;justify-content:center;min-height:100vh;
  }
  .stage{
    width:100%;max-width:480px;position:relative;overflow:hidden;
    background:radial-gradient(120% 65% at 50% 0%, #E03030 0%, #C01820 45%, #8E0F16 100%);
    box-shadow:0 0 60px rgba(0,0,0,.5);
  }
  .stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(232,199,130,.18) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(-45deg, rgba(232,199,130,.18) 0 1px, transparent 1px 24px);
  }

  .lantern{position:absolute;top:0;z-index:2;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));}
  .lantern.l{left:14px;}
  .lantern.r{right:14px;transform:scaleX(-1);}

  .wrap{position:relative;z-index:3;padding:34px 26px 30px;}

  .brand{display:block;width:168px;max-width:46%;margin:0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}

  .head{text-align:center;margin-top:22px;}
  .eyebrow{font-size:12px;letter-spacing:.55em;text-indent:.55em;color:#C9A24F;}
  h1{
    font-family:'Noto Serif SC',serif;font-weight:900;
    font-size:clamp(56px,19vw,84px);letter-spacing:.12em;text-indent:.12em;line-height:1.1;
    margin-top:8px;
    background:linear-gradient(180deg,#FBEDC6 0%,#E9C783 55%,#C9963F 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub{
    margin-top:16px;display:inline-block;position:relative;
    font-family:'Noto Serif SC',serif;font-weight:700;font-size:21px;letter-spacing:.3em;text-indent:.3em;
    color:var(--gold-bright);padding:0 14px;
  }
  .sub::before,.sub::after{
    content:"";position:absolute;top:50%;width:30px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));
  }
  .sub::before{right:100%;}
  .sub::after{left:100%;background:linear-gradient(90deg,var(--gold),transparent);}

  .goods{position:relative;margin-top:24px;text-align:center;}
  .goods img{width:104%;max-width:440px;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5));animation:float 5s ease-in-out infinite;}
  .goods img.tree{position:absolute;right:4%;top:-16%;width:25%;z-index:4;transform-origin:bottom center;
    animation:sway 4.5s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));}
  @keyframes sway{0%,100%{transform:rotate(-3.5deg);}50%{transform:rotate(3.5deg);}}
  .coin{position:absolute;width:14px;height:14px;z-index:5;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#FFF0B8,#D4A017);
    box-shadow:0 0 6px #FFD873;opacity:0;animation:dropfall linear infinite;}
  .coin::after{content:"";position:absolute;inset:4px;border:1px solid rgba(120,70,10,.55);border-radius:2px;}
  @keyframes dropfall{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0;}12%{opacity:1;}100%{transform:translateY(150px) translateX(18px) rotate(360deg);opacity:0;}}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

  .panel{
    position:relative;z-index:3;margin:26px -6px 0;
    background:linear-gradient(180deg,#FBF4E6 0%,#F3E6CC 100%);
    border-radius:22px 22px 0 0;
    padding:30px 24px 28px;
    box-shadow:0 -8px 30px rgba(0,0,0,.35);
  }
  .panel::before{
    content:"";position:absolute;top:10px;left:14px;right:14px;height:1px;
    background:linear-gradient(90deg,transparent,#C9A24F,transparent);
  }

  .calli{width:80%;margin:0 auto;}
  .calli img{width:100%;display:block;filter:drop-shadow(0 3px 5px rgba(120,80,20,.3));}

  .lead{
    text-align:center;margin-top:16px;
    font-family:'Noto Serif SC',serif;font-weight:700;font-size:18px;letter-spacing:.1em;color:var(--wine-mid);
  }
  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px;}
  .divider .ln{width:48px;height:1px;background:#C9A24F;}
  .divider .dia{width:8px;height:8px;background:var(--wine-mid);transform:rotate(45deg);}

  .info{margin-top:16px;}
  .row{
    display:flex;align-items:center;gap:14px;
    padding:14px;border-radius:12px;margin-bottom:10px;
    background:rgba(255,251,243,.7);border:1px solid rgba(201,162,79,.35);
  }
  .row .ic{
    flex:0 0 42px;width:42px;height:42px;border-radius:50%;
    background:linear-gradient(180deg,#7A151B,#5A0E13);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(90,14,19,.3);
  }
  .row .ic svg{width:20px;height:20px;fill:none;stroke:#E9C783;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .row .lb{font-size:12px;letter-spacing:.18em;color:#9C7A3C;margin-bottom:3px;}
  .row .vl{font-size:16px;font-weight:700;color:#4A0A0E;line-height:1.4;}
  .row .vl .meal{font-size:14px;font-weight:500;color:#8A5A3A;margin-left:6px;}

  .go{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin-top:18px;padding:15px;border-radius:40px;text-decoration:none;
    background:linear-gradient(180deg,#7A151B,#5A0E13);
    color:#F0D489;font-weight:700;letter-spacing:.2em;font-size:15px;
    box-shadow:0 8px 20px rgba(90,14,19,.4),inset 0 0 0 1px rgba(233,199,131,.5);
  }
  .go svg{width:18px;height:18px;stroke:#F0D489;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .seal{
    width:fit-content;margin:22px auto 0;
    border:1.5px solid var(--wine-mid);color:var(--wine-mid);
    font-family:'Noto Serif SC',serif;font-weight:700;font-size:14px;letter-spacing:.3em;text-indent:.3em;
    padding:8px 16px 8px 19px;border-radius:4px;transform:rotate(-2deg);
  }

  .foot{position:relative;margin-top:24px;line-height:0;}
  .foot svg{display:block;width:100%;height:30px;}

  .foil{position:absolute;top:-10px;width:6px;height:6px;z-index:5;pointer-events:none;
    background:linear-gradient(135deg,#FBEDC6,#D9AE5F);opacity:0;border-radius:1px;
    animation:fall linear infinite;}
  @keyframes fall{
    0%{transform:translateY(-5vh) rotate(0);opacity:0;}
    10%{opacity:.9;}
    100%{transform:translateY(115vh) rotate(360deg);opacity:0;}
  }

  .fade{opacity:0;transform:translateY(18px);}
  .fade.in{opacity:1;transform:none;transition:all .8s ease;}
  .d1{transition-delay:.05s}.d2{transition-delay:.18s}.d3{transition-delay:.3s}
  .d4{transition-delay:.42s}.d5{transition-delay:.54s}.d6{transition-delay:.66s}
</style>
</head>
